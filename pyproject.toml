[project]
name = "agent-sante"
version = "0.1.0"
description = "Agent WhatsApp santé et transport (Ouagadougou)"
requires-python = ">=3.12,<3.13"

dependencies = [
  # --- API et configuration ---
  "fastapi[standard]>=0.143.3",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "pyyaml>=6",

  # --- Client WhatsApp ---
  "pywa[fastapi]>=4.5,<5",

  # --- Orchestration de l'agent ---
  "langgraph>=1.2.16,<2",

  # --- LLM : SDK Groq direct (pas de langchain-groq : exige groq<1.0) ---
  "groq>=1.7,<2",

  # --- HTTP et reprises ---
  "httpx>=0.28.1",
  "tenacity>=9.2",

  # --- Base de données et migrations ---
  "psycopg[binary,pool]>=3.3,<4",
  "sqlalchemy[asyncio]>=2.1,<3",
  "alembic>=1.20",

  # --- Sécurité et observabilité ---
  "cryptography>=50",
  "structlog>=26.1",
  "sentry-sdk[fastapi]>=2.72,<3",

  # --- Images et documents ---
  "pillow>=10.3,<13",
  "img2pdf>=0.6.3",
  "rapidfuzz>=3.14",
]

[project.optional-dependencies]
# ATTENTION : ne jamais installer opencv-python-headless en plus (conflit cv2)
ocr-local = [
  "paddleocr>=3.7,<4",
  "paddlepaddle>=3.3",
]

# Système requis : ffmpeg
voice = [
  "faster-whisper>=1.2.1",
  "piper-tts>=1.8",
  "soundfile>=0.14",
]

vector-faiss = [
  "faiss-cpu>=1.15.1,<2",
  "fastembed>=0.9",
]

vector-pinecone = [
  "pinecone>=10,<11",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "hypothesis>=6.170",
  "respx>=0.23",
  "testcontainers[postgres]>=4.15",
  "faker>=40",
  "reportlab>=5",
  "ruff>=0.17",
  "mypy>=2.4",
  "types-pyyaml",
  "pre-commit>=4.7",
  "ipykernel>=7.4.0",
  "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv]
default-groups = ["dev"]
# PaddleOCR (via PaddleX) exige numpy<2.4 ; valable pour tous les extras
constraint-dependencies = ["numpy<2.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S311"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
